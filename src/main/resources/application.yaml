spring:
  application:
    name: subscription-service
  output:
    ansi:
      enabled: always
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/subscription_service}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  docker:
    compose:
      enabled: ${DOCKER_COMPOSE_ENABLED:true}
      file: docker-compose.yaml

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: always
    include-message: always

onno:
  ui:
    locale: en
  auth:
    mode: in-memory
    session:
      timeout: 8h
      remember-me:
        enabled: true
        validity: 14d
        allow-ephemeral-key: true
    users:
      - username: admin
        password: admin
        roles: [ADMIN]
      - username: manager
        password: manager
        roles: [MANAGER]

org:
  jobrunr:
    database:
      type: sql
    background-job-server:
      enabled: true
    dashboard:
      enabled: false